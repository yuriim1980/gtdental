<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%" role="img" aria-label="GT Dental - Clinică stomatologică">
  <defs>
    <!-- Градиент для контура зуба (адаптирован под темный фон) -->
    <linearGradient id="heroLogoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ab4f8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Свечение вокруг логотипа -->
    <radialGradient id="bgGlow">
      <stop offset="0%" stop-color="#5ea8ee" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#5ea8ee" stop-opacity="0" />
    </radialGradient>

    <!-- Легкое свечение для самого контура зуба -->
    <filter id="strokeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Фоновое свечение по центру -->
  <ellipse cx="490" cy="170" rx="250" ry="200" fill="url(#bgGlow)" />

  <!-- Центральная группа -->
  <g transform="translate(490, 210)">
    
    <!-- Векторный зуб из шапки сайта (увеличенный и отцентрированный) -->
    <g transform="translate(0, -70) scale(2.2)">
      <path fill="none" stroke="url(#heroLogoGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#strokeGlow)" d="M30 10C17 10 8 20 8 33c0 10 4 16 7 23 3 6 4 13 5 21 1 8 4 11 7 11 5 0 6-6 8-13 1-8 4-14 13-14s12 6 13 14c2 7 3 13 8 13 3 0 6-3 7-11 1-8 2-15 5-21 3-7 7-13 7-23 0-13-9-23-22-23-7 0-11 4-18 4s-11-4-18-4Z" transform="translate(-48, -48)" />
    </g>

    <!-- Текст логотипа (светлый) -->
    <text x="0" y="70" font-family="Inter, &#39;SF Pro Display&#39;, Helvetica, Arial, sans-serif" font-size="56" text-anchor="middle" letter-spacing="-0.02em">
      <tspan fill="#ffffff" font-weight="700">GT </tspan>
      <tspan fill="#8ab4f8" font-weight="500">DENTAL</tspan>
    </text>
    
    <!-- Подзаголовок -->
    <text x="0" y="115" font-family="Inter, &#39;SF Pro Display&#39;, Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#a9b8c8" font-weight="500" letter-spacing="0.2em">
      CLINICĂ STOMATOLOGICĂ
    </text>
    
  </g>
</svg>